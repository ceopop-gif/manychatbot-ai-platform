name: Import MANYCHATBOT Sites v9

on:
  push:
    paths:
      - ".github/workflows/import-sites-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-manychatbot-sites-v9
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact Sites source commit
        env:
          SOURCE_REPO: https://git.chatgpt-team.site/239e-fill_acl9dd6facb734818995871e9f10728c/6a9f69cc85d08191bcd12a5ba433f7d0.git
          SOURCE_COMMIT: cb6d0421c5f922e8db0a0ae64bf1028a185cd405
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          rm -rf "$RUNNER_TEMP/manychatbot-sites-v9"
          git clone --no-tags "$SOURCE_REPO" "$RUNNER_TEMP/manychatbot-sites-v9"
          git -C "$RUNNER_TEMP/manychatbot-sites-v9" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/manychatbot-sites-v9" rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Block secrets and private files
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/manychatbot-sites-v9"

          if find "$SRC" -type f \( -name ".env" -o -name ".env.local" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" -o -name "id_rsa" -o -name "id_ed25519" \) -print -quit | grep -q .; then
            echo "Import stopped: a private configuration or key file was detected."
            exit 1
          fi

          if grep -RqE --exclude-dir=.git --exclude='*.lock' --exclude='package-lock.json'             '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|llgw_(live|test)_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|-----BEGIN ([A-Z ]+)?PRIVATE KEY-----)' "$SRC"; then
            echo "Import stopped: a value resembling a secret or token was detected."
            exit 1
          fi

      - name: Copy version 9 source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/manychatbot-sites-v9/"
          rsync -a --delete             --exclude=".git/"             --exclude=".github/workflows/import-sites-v9.yml"             "$SRC" "$GITHUB_WORKSPACE/"

          mkdir -p .github/workflows
          git checkout HEAD -- .github/workflows/import-sites-v9.yml

          cat > SITES_SOURCE_VERSION.md <<'EOF'
          # Sites source version

          - Site: MANYCHATBOT
          - Version: 9
          - Commit: `cb6d0421c5f922e8db0a0ae64bf1028a185cd405`
          - Imported from the Sites source repository
          EOF

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Version 9 is already synchronized."
            exit 0
          fi
          git commit -m "Import MANYCHATBOT Sites version 9"
          git push origin HEAD:main
