name: Secure import MANYCHATBOT Sites v9

on:
  push:
    paths:
      - ".github/workflows/import-sites-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secure-import-manychatbot-sites-v9
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create one-time encryption key
        run: |
          set -euo pipefail
          PRIVATE_KEY="$RUNNER_TEMP/import-private.pem"
          PUBLIC_KEY=".github/import-key.pub"
          mkdir -p .github
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$PRIVATE_KEY" 2>/dev/null
          openssl rsa -in "$PRIVATE_KEY" -RSAPublicKey_out -out "$PUBLIC_KEY" 2>/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PUBLIC_KEY"
          git commit -m "Create one-time import key"
          git push origin HEAD:main

      - name: Wait for encrypted Sites credential
        run: |
          set -euo pipefail
          FOUND=0
          for attempt in $(seq 1 90); do
            git fetch --quiet origin main
            if git cat-file -e origin/main:.github/import-token.enc 2>/dev/null; then
              git show origin/main:.github/import-token.enc > "$RUNNER_TEMP/import-token.enc"
              git reset --hard origin/main
              FOUND=1
              break
            fi
            sleep 5
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "Import stopped: encrypted credential was not received in time."
            exit 1
          fi

      - name: Decrypt credential and clone exact Sites source
        env:
          SOURCE_REPO: https://git.chatgpt-team.site/239e89d4-d8fb-427a-8b00-7b00e6e41d0a/appgprj_6a9f69cc85d08191bcd12a5ba433f7d0.git
          SOURCE_COMMIT: cb6d0421c5f922e8db0a0ae64bf1028a185cd405
        run: |
          set -euo pipefail
          PRIVATE_KEY="$RUNNER_TEMP/import-private.pem"
          CIPHER_FILE="$RUNNER_TEMP/import-token.bin"
          TOKEN_FILE="$RUNNER_TEMP/import-token.txt"
          base64 -d "$RUNNER_TEMP/import-token.enc" > "$CIPHER_FILE"
          openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" -pkeyopt rsa_padding_mode:pkcs1 -in "$CIPHER_FILE" -out "$TOKEN_FILE"
          SOURCE_TOKEN="$(tr -d '\r\n' < "$TOKEN_FILE")"
          test -n "$SOURCE_TOKEN"
          echo "::add-mask::$SOURCE_TOKEN"
          export GIT_TERMINAL_PROMPT=0

          SRC="$RUNNER_TEMP/manychatbot-sites-v9"
          rm -rf "$SRC"
          if ! git -c "http.extraHeader=Authorization: Bearer $SOURCE_TOKEN" clone --no-tags "$SOURCE_REPO" "$SRC"; then
            rm -rf "$SRC"
            BASIC_AUTH="$(printf 'oauth2:%s' "$SOURCE_TOKEN" | base64 -w0)"
            echo "::add-mask::$BASIC_AUTH"
            if ! git -c "http.extraHeader=Authorization: Basic $BASIC_AUTH" clone --no-tags "$SOURCE_REPO" "$SRC"; then
              rm -rf "$SRC"
              BASIC_AUTH="$(printf 'x-token-auth:%s' "$SOURCE_TOKEN" | base64 -w0)"
              echo "::add-mask::$BASIC_AUTH"
              git -c "http.extraHeader=Authorization: Basic $BASIC_AUTH" clone --no-tags "$SOURCE_REPO" "$SRC"
            fi
          fi

          git -C "$SRC" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_COMMIT"
          rm -f "$TOKEN_FILE" "$CIPHER_FILE" "$RUNNER_TEMP/import-token.enc" "$PRIVATE_KEY"

      - name: Block secrets and private files
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/manychatbot-sites-v9"

          if find "$SRC" -type f \( -name ".env" -o -name ".env.local" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" -o -name "id_rsa" -o -name "id_ed25519" \) -print -quit | grep -q .; then
            echo "Import stopped: a private configuration or key file was detected."
            exit 1
          fi

          if grep -RqE --exclude-dir=.git --exclude='*.lock' --exclude='package-lock.json' '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|llgw_(live|test)_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|-----BEGIN ([A-Z ]+)?PRIVATE KEY-----)' "$SRC"; then
            echo "Import stopped: a value resembling a secret or token was detected."
            exit 1
          fi

      - name: Copy and commit version 9 source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/manychatbot-sites-v9/"
          rsync -a --delete --exclude=".git/" --exclude=".github/workflows/import-sites-v9.yml" "$SRC" "$GITHUB_WORKSPACE/"
          mkdir -p .github/workflows
          git checkout HEAD -- .github/workflows/import-sites-v9.yml
          rm -f .github/import-key.pub .github/import-token.enc

          cat > SITES_SOURCE_VERSION.md <<'EOF'
          # Sites source version

          - Site: MANYCHATBOT
          - Version: 9
          - Commit: `cb6d0421c5f922e8db0a0ae64bf1028a185cd405`
          - Imported securely from the Sites source repository
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Version 9 is already synchronized."
            exit 0
          fi
          git commit -m "Import MANYCHATBOT Sites version 9"
          git push origin HEAD:main
